# ---------------------------------------------------------------------------
# TANESCO Meter Companion - Gradle configuration
#
# Every value here is a deliberate resource decision for the primary build
# environment: an Android phone running Termux under PRoot (aarch64, 8 cores,
# ~3.6 GB RAM total, and typically well under 1 GB *available* to a build).
#
# The single most important setting on this device is `org.gradle.jvmargs`.
# See docs/decisions/0002-build-script-dsl.md for the measurements behind it.
# ---------------------------------------------------------------------------

# --- JVM / Gradle -----------------------------------------------------------
# Heap is deliberately modest. A larger heap does not make this build faster:
# the device cannot satisfy it without heavy swap thrashing under PRoot, which
# makes configuration minutes slower and risks the kernel killing the daemon
# mid-build (Gradle then silently restarts it and the build never progresses).
# 768m with a serial collector is the largest size observed to run stably.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

# Run the Kotlin compiler inside the Gradle daemon rather than forking a second
# JVM. On a device this memory constrained, one JVM is meaningfully cheaper.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# compileSdk 35 is present in the Termux SDK, but AGP 8.6.1 officially tests up
# to 34. The combination builds correctly; this flag acknowledges it.
android.suppressUnsupportedCompileSdk=35

# --- Build behaviour --------------------------------------------------------
org.gradle.warning.mode=summary
