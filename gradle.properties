# TANESCO Meter Companion — memory-conscious Gradle configuration.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.suppressUnsupportedCompileSdk=35

# Do not hard-code a Termux filesystem path here: hosted CI and desktop builds
# must use their own Maven/host AAPT2. tools/build.sh supplies the Termux binary
# as a command-line override when it exists on the Android build phone.
org.gradle.warning.mode=summary
