/*
 * :app - the presentation layer (Jetpack Compose) and the application shell.
 *
 * The only module allowed to depend on :connection, and even then only through
 * the interface. Nothing here may reach around the abstraction.
 */
plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.compose
}

android {
    namespace 'com.tanesco.metercompanion.app'

    defaultConfig {
        applicationId 'com.tanesco.metercompanion'
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Only locales the application actually ships are kept in the APK.
        resourceConfigurations += ['en']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // Shrinking is enabled for release only; routine verification runs
            // against debug on the build device.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':core')
    implementation project(':data')
    implementation project(':connection')
    implementation project(':platform')

    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation.compose

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    debugImplementation libs.compose.ui.tooling

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.espresso.core
    debugImplementation libs.compose.ui.test.manifest
}
